# Alvo "production" do deploy/deploy.sh (spec 037). Pares CHAVE=valor, sem segredo, lidos como texto
# (nunca por `source`). Valores só com letras, números e . _ / : @ % + , - (sem espaço, aspas nem $).
# O hostname abaixo é público; troque se o domínio de produção for outro.

# Diretório do clone e do .env. O dotenv lê o .env do diretório atual do backend: ENV_FILE tem de ser
# <APP_DIR>/backend/.env (o script confere).
APP_DIR=/var/www/soprei
ENV_FILE=/var/www/soprei/backend/.env

# Nome do app no PM2 (ver deploy/ecosystem.config.cjs) e porta da API (só em 127.0.0.1).
PM2_APP=soprei-api
PORT=3001
HEALTH_URL=http://127.0.0.1:3001/health
READY_URL=http://127.0.0.1:3001/health/ready

# Site: conferido por https://<SITE_HOST>/ resolvido para 127.0.0.1 (certificado verificado).
SITE_HOST=www.soprei.com
SITE_OK_CODES=200

# D8: a produção só aceita o SHA que já está no staging (--allow-unstaged para emergência).
REQUIRE_STAGED=true

# Programa do dono, fora do repositório (exemplo em deploy/backup/soprei-predeploy-backup.example).
# Roda antes de migration pendente; em produção é exigido com --allow-breaking.
PRE_MIGRATION_BACKUP=/usr/local/sbin/soprei-predeploy-backup

# Prazos (segundos) e limites.
HEALTH_TIMEOUT_SECONDS=90
HEALTH_INTERVAL_SECONDS=2
HEALTH_STABLE_COUNT=5
MIGRATE_TIMEOUT_SECONDS=300
MIN_FREE_KB=2097152
BUILD_MEMORY_MB=1024
