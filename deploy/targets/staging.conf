# Alvo "staging" do deploy/deploy.sh (spec 037). Pares CHAVE=valor, sem segredo, lidos como texto
# (nunca por `source`). Nada aqui pode repetir porta, app do PM2, diretório, .env ou URL de saúde da
# produção (um teste confere). O hostname é um exemplo: troque pelo do staging do dono.

APP_DIR=/var/www/soprei-staging
ENV_FILE=/var/www/soprei-staging/backend/.env

PM2_APP=soprei-staging
PORT=3002
HEALTH_URL=http://127.0.0.1:3002/health
READY_URL=http://127.0.0.1:3002/health/ready

# O staging tem senha básica no nginx (D5): 401 prova que o nginx está no ar e protegendo o site.
SITE_HOST=staging.soprei.com
SITE_OK_CODES=200,401

# Admin da plataforma no staging (spec 044, E4; opcional): descomente só depois de instalar o nginx
# do admin do staging (deploy/nginx/admin-staging.conf.example), que também tem senha básica (401).
# ADMIN_HOST=soadm-staging.soprei.com
# ADMIN_OK_CODES=200,401

REQUIRE_STAGED=false

# Sem cópia antes de migration no staging (banco descartável). PRE_MIGRATION_BACKUP fica vazio.

HEALTH_TIMEOUT_SECONDS=90
HEALTH_INTERVAL_SECONDS=2
HEALTH_STABLE_COUNT=5
MIGRATE_TIMEOUT_SECONDS=300
MIN_FREE_KB=2097152
BUILD_MEMORY_MB=1024
