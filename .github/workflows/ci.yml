name: CI

# Spec 036. Nos PRs e na main a suíte roda numa só versão do Node, a do `.nvmrc` (a de produção).
# O workflow "Compatibilidade do Node" (node-compat.yml) chama este mesmo arquivo uma vez por semana
# com outras versões, pela entrada `node-version`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      node-version:
        description: Versão do Node. Vazio usa a do .nvmrc.
        type: string
        default: ''
      artifact-suffix:
        description: Sufixo do nome dos artefatos (evita colisão quando o chamador usa matriz).
        type: string
        default: ''

# Push novo no mesmo PR cancela a execução anterior. Na main (e na execução semanal) nada é cancelado:
# cada commit termina a sua execução.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.node-version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Checagens estáticas e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: .nvmrc
          cache: pnpm

      # Núcleos do runner (2 em repositório privado, 4 em público): referência para as medições.
      - run: nproc

      - run: pnpm install --frozen-lockfile

      # O Prisma Client (src/generated, ignorado pelo git) precisa existir antes do typecheck.
      # O `prisma generate` só lê a URL (não conecta); este job não tem banco.
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://soprei:soprei@localhost:5432/soprei_test?schema=public

      # Os scripts da raiz cobrem backend, site e admin (spec 044, E4; ci-workflow.test.ts confere).
      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      # Scripts de deploy (spec 037): o shellcheck já vem na imagem do runner (ubuntu-latest).
      - run: shellcheck deploy/*.sh

      # Scripts de backup (spec 043).
      - run: shellcheck deploy/backup/*.sh

      # Workflows (spec 037, E3): actionlint em versão fixa, com o SHA-256 conferido antes de extrair.
      # Fonte da soma: actionlint_1.7.12_checksums.txt do release v1.7.12 de rhysd/actionlint no GitHub
      # (https://github.com/rhysd/actionlint/releases/tag/v1.7.12), conferido em 2026-11-12. Para trocar
      # de versão, troque as duas variáveis juntas, com a soma do arquivo de checksums do release novo.
      - name: Instalar o actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >>"$GITHUB_PATH"

      # Usa o shellcheck da imagem nos blocos `run:` e lê todos os arquivos de .github/workflows.
      - run: actionlint

      - run: pnpm build

  tests:
    name: Testes unitários e de integração
    runs-on: ubuntu-latest

    # Serviços só do CI (no desenvolvimento local, Postgres e Redis rodam nativos, sem Docker).
    # Postgres na mesma major do ambiente local do dono (18); Redis 8, idem.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: soprei
          POSTGRES_PASSWORD: soprei
          POSTGRES_DB: soprei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soprei -d soprei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Credenciais descartáveis dos serviços acima; os testes só aceitam soprei_test e Redis /15.
    env:
      DATABASE_URL: postgresql://soprei:soprei@localhost:5432/soprei_test?schema=public
      REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: .nvmrc
          cache: pnpm

      - run: nproc

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - run: pnpm db:migrate:deploy

      # Repórter "dot": um ponto por teste e, no fim, só os testes que falharam ou foram
      # cancelados (com nome e erro). O log completo de 1200+ testes escondia o que importa.
      - run: pnpm test
        env:
          NODE_OPTIONS: --test-reporter=dot

      # Um arquivo por vez (`--test-concurrency=1` no script): há testes que agem no banco inteiro.
      - run: pnpm test:integration
        env:
          NODE_OPTIONS: --test-reporter=dot

  browser:
    name: Navegador (fatia ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cada fatia roda num job próprio, com 1 worker (recomendação do Playwright para CI).
        # O total de fatias é o tamanho desta lista (`strategy.job-total`).
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: .nvmrc
          cache: pnpm

      - run: nproc

      - run: pnpm install --frozen-lockfile

      # Versão do Playwright instalada (a do lockfile): é a chave do cache do navegador.
      - id: playwright
        run: echo "version=$(pnpm --filter soprei-frontend exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Sem restore-keys: nunca se reaproveita o navegador de outra versão do Playwright.
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter soprei-frontend exec playwright install chromium

      # Sem instalar bibliotecas do sistema pelo apt: a imagem do runner já traz todas as que o Chromium
      # usa (o apt só acrescentava fontes extras, que os testes não usam) e o apt já derrubou as três
      # fatias por falha de DNS. Se uma imagem futura perder uma biblioteca, o navegador não abre e
      # o erro é explícito; aí se volta a instalar só o que faltar.

      # Spec 044, E4: o admin usa o navegador em cache pela versão do site; as duas precisam ser iguais.
      - name: Mesma versão do Playwright no site e no admin
        env:
          SITE_PLAYWRIGHT: ${{ steps.playwright.outputs.version }}
        run: test "$(pnpm --filter soprei-admin exec playwright --version | awk '{print $2}')" = "$SITE_PLAYWRIGHT"

      - run: pnpm --filter soprei-frontend test:browser --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Admin da plataforma (spec 044, E4), nas mesmas fatias. Roda mesmo se o do site falhou: uma falha
      # não esconde a outra.
      - if: ${{ !cancelled() }}
        run: pnpm --filter soprei-admin test:browser --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Rastreamento (linha do tempo, DOM e rede) das tentativas que falharam, mesmo as que passaram na
      # retentativa. Baixe em "Artifacts" na página da execução e abra com: npx playwright show-trace <zip>.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces-${{ matrix.shard }}${{ inputs.artifact-suffix }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces-admin-${{ matrix.shard }}${{ inputs.artifact-suffix }}
          path: admin/test-results
          if-no-files-found: ignore
          retention-days: 7
