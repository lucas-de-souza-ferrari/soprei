<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Laboratório E0 (coexistência)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 24px auto;
        padding: 0 16px;
        background: #fff;
        color: #111;
      }
      button {
        font-size: 16px;
        padding: 10px 16px;
        margin: 6px 6px 6px 0;
        cursor: pointer;
      }
      #code {
        font-family: monospace;
        word-break: break-all;
        background: #fff3cd;
        padding: 8px;
      }
      pre {
        background: #f4f4f4;
        padding: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Laboratório E0: coexistência</h1>
    <p>
      Página temporária de teste (spec 039). Nada aqui é gravado. Esteja logado no Soprei com a
      empresa selecionada nesta mesma aba antes de começar.
    </p>
    <button id="load">1. Carregar o SDK da Meta</button>
    <button id="open" disabled>2. Abrir o popup (coexistência)</button>
    <h2>Code (vale cerca de 30 segundos)</h2>
    <div id="code">(ainda nenhum)</div>
    <button id="copy" disabled>Copiar o code</button>
    <h2>Registro (pode colar no chat: não tem telefone, token nem code)</h2>
    <pre id="log"></pre>

    <script>
      'use strict';
      const SDK_URL = 'https://connect.facebook.net/en_US/sdk.js';
      const META_ORIGINS = ['https://www.facebook.com', 'https://web.facebook.com'];
      const logEl = document.getElementById('log');
      const codeEl = document.getElementById('code');
      let setup = null;
      let code = '';

      function stamp() {
        return new Date().toISOString().slice(11, 19);
      }
      function log(line) {
        logEl.textContent += `[${stamp()}] ${line}\n`;
      }

      // Só nomes de chaves e valores seguros (nunca ids, telefone, token ou code).
      const SAFE_VALUE_KEYS = new Set([
        'type',
        'event',
        'version',
        'current_step',
        'error_code',
        'error_message',
        'status',
      ]);
      function describe(value, depth = 0) {
        if (value === null) return 'null';
        if (Array.isArray(value)) return `lista(${value.length})`;
        if (typeof value === 'object') {
          if (depth > 2) return 'objeto';
          const parts = Object.keys(value).map((key) => {
            const inner = value[key];
            if (
              SAFE_VALUE_KEYS.has(key) &&
              (typeof inner === 'string' || typeof inner === 'number')
            ) {
              return `${key}=${JSON.stringify(inner)}`;
            }
            if (inner !== null && typeof inner === 'object')
              return `${key}:{${describe(inner, depth + 1)}}`;
            return `${key}:${typeof inner}`;
          });
          return parts.join(', ');
        }
        return typeof value;
      }

      window.addEventListener('message', (event) => {
        if (!META_ORIGINS.includes(event.origin)) return;
        let data = event.data;
        if (typeof data === 'string') {
          try {
            data = JSON.parse(data);
          } catch {
            return;
          }
        }
        if (data === null || typeof data !== 'object') return;
        if (data.type !== 'WA_EMBEDDED_SIGNUP') return;
        log(`EVENTO da Meta: ${describe(data)}`);
      });

      async function loadSetup() {
        const session = await fetch('/api/auth/session', { credentials: 'same-origin' });
        if (!session.ok) throw new Error(`sessão ${session.status} (entre no Soprei antes)`);
        const { selectedCompanyId } = await session.json();
        if (!selectedCompanyId) throw new Error('nenhuma empresa selecionada no Soprei');
        const res = await fetch(`/api/admin/companies/${selectedCompanyId}/channel/setup`, {
          credentials: 'same-origin',
          headers: { 'X-Soprei-App': 'web' },
        });
        if (!res.ok) throw new Error(`setup do canal ${res.status}`);
        const body = await res.json();
        if (!body.embeddedSignup) throw new Error('Embedded Signup não configurado no servidor');
        return body.embeddedSignup;
      }

      document.getElementById('load').addEventListener('click', async () => {
        try {
          setup = await loadSetup();
          log(`configuração lida (versão da Graph ${setup.graphApiVersion})`);
        } catch (error) {
          log(`ERRO: ${error.message}`);
          return;
        }
        window.fbAsyncInit = () => {
          window.FB.init({
            appId: setup.appId,
            autoLogAppEvents: false,
            xfbml: false,
            version: setup.graphApiVersion,
          });
          log('SDK da Meta carregado; clique em 2');
          document.getElementById('open').disabled = false;
        };
        const script = document.createElement('script');
        script.src = SDK_URL;
        script.async = true;
        script.onerror = () => log('ERRO: o SDK da Meta não carregou (bloqueador de conteúdo?)');
        document.head.append(script);
      });

      // O popup precisa abrir na mesma chamada do clique (senão o navegador o bloqueia).
      document.getElementById('open').addEventListener('click', () => {
        log('abrindo o popup com featureType = whatsapp_business_app_onboarding');
        window.FB.login(
          (response) => {
            const auth = response && response.authResponse;
            log(
              `resposta do FB.login: status=${JSON.stringify(response && response.status)}; ${auth ? describe(auth) : 'sem authResponse'}`,
            );
            if (auth && typeof auth.code === 'string' && auth.code !== '') {
              code = auth.code;
              codeEl.textContent = code;
              document.getElementById('copy').disabled = false;
              log('CODE recebido: copie e cole no servidor agora (vale ~30 s)');
            }
          },
          {
            config_id: setup.configId,
            response_type: 'code',
            override_default_response_type: true,
            extras: {
              setup: {},
              featureType: 'whatsapp_business_app_onboarding',
              sessionInfoVersion: '3',
            },
          },
        );
      });

      document.getElementById('copy').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(code);
          log('code copiado');
        } catch {
          log('não consegui copiar: selecione o code acima e copie à mão');
        }
      });
    </script>
  </body>
</html>
